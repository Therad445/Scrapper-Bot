app:
  telegram-token: ${TELEGRAM_TOKEN}
  scrapper-url: ${SCRAPPER_URL}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    topic: ${KAFKA_TOPIC:link-updates}
    dlq-topic: ${KAFKA_DLQ_TOPIC:link-updates-dlq}

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
