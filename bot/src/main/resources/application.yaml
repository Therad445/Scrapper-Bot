app:
  telegram-token:    ${TELEGRAM_TOKEN}
  scrapper-url:      ${SCRAPPER_URL}
  cache-ttl:         ${CACHE_TTL:3000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:             ${KAFKA_TOPIC}
    dlq-topic:         ${KAFKA_DLQ_TOPIC}
    commands-topic:    ${KAFKA_BOT_TO_SCRAPPER}

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
